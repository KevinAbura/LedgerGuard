spring:
  application:
    name: ledgerguard
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ledgerguard}
    username: ${DATABASE_USER:ledgerguard}
    password: ${DATABASE_PASSWORD:ledgerguard}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:16}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

ledgerguard:
  bootstrap:
    development-enabled: ${DEV_BOOTSTRAP_ENABLED:false}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    topic: ${LEDGER_EVENTS_TOPIC:ledger.events.v1}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    publish-timeout-ms: ${OUTBOX_PUBLISH_TIMEOUT_MS:10000}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
  rate-limit:
    fallback-capacity: ${RATE_LIMIT_FALLBACK_CAPACITY:20}
    fallback-refill-per-second: ${RATE_LIMIT_FALLBACK_REFILL:10}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
