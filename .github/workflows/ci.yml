name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
      - name: Lint OpenAPI 3.1 contract
        env:
          REDOCLY_TELEMETRY: "off"
        run: npx --yes @redocly/cli@2.38.0 lint src/main/resources/static/openapi.yaml --extends=spec --format=github-actions

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Unit and PostgreSQL integration tests
        run: mvn --batch-mode verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the complete stack
        run: docker compose up -d --build
      - name: HTTP idempotency and invariant E2E
        run: ./scripts/e2e.sh
      - name: Compose logs
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
